# Cloudflare Pages 配置（本应用是纯前端，无服务端代码）
#
# 方式一（推荐，自动发版）：Cloudflare Dashboard → Workers & Pages → Create → Pages →
#   连接 GitHub 仓库 QWQFuLan/pallet-scan，构建命令 `npm run build`，输出目录 `dist`。
#   之后每次 git push 到 main 会自动重新部署。
# 方式二（手动）：npm run deploy
#
# 注意：不要在 dist 里放 `_redirects` —— 实测在 Pages 上会触发
#   "Failed to publish your Function. Got error: Unknown internal error occurred."
#   本应用是单页且入口就是 /，不需要 SPA 回落规则。
name = "pallet-scan"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"
